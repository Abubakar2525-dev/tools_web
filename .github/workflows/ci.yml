name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, checks, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check:catalog
      - run: npm run test:tools
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.example.com

  api:
    name: API (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt
      - run: npm run test:api

  deploy:
    name: Deploy (FTP)
    needs: [web, api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.example.com

      - name: Stage files to upload
        run: |
          mkdir deploy
          cp -r .next public deploy/
          cp package.json package-lock.json next.config.ts deploy/

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 82.198.232.10
          port: 21
          protocol: ftp
          username: u990703575.nuvellapromocode.online
          password: "@Bakar@2002!"
          local-dir: ./deploy/ 
